# docker compose up -d   (set secrets in .env next to this file first — see .env.example)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smartcard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: smartcard
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U smartcard"], interval: 5s, retries: 10 }
    restart: unless-stopped
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://smartcard:${DB_PASSWORD}@db:5432/smartcard
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      OWNER_USERNAME: ${OWNER_USERNAME:-}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
      OWNER_PIN: ${OWNER_PIN:-}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-none}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      OTP_PROVIDER: ${OTP_PROVIDER:-none}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    ports: ["4000:4000"]
    volumes: [uploads:/data/uploads]
    restart: unless-stopped
volumes:
  pgdata:
  uploads:
